[project]
name = "roommate-recognizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opencv-python", "numpy", "python-dotenv", "pandas", "matplotlib", "psutil"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]